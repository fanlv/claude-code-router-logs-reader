                originalResponse: params.get('originalResponse') === '1'
            };
        }

        async function deleteFile(filename, source, event) {
            event.stopPropagation();
            if (!confirm(`确定要删除文件 "${filename}" 吗？`)) {
                return;
            }
            
            try {
                const response = await fetch(`/api/files/${encodeURIComponent(filename)}?source=${source}`, {
                    method: 'DELETE'
                });
                if (!response.ok) {
                    const data = await response.json();
                    throw new Error(data.error || '删除失败');
                }
                showToast('删除成功');
                if (currentFile === filename && currentSource === source) {
                    currentFile = null;
                    currentSource = null;
                    document.getElementById('contentTitle').textContent = '选择一个文件查看';
                    document.getElementById('logCount').textContent = '';
                    document.getElementById('backBtn').style.display = 'none';
                    document.getElementById('viewJsonBtn').style.display = 'none';
                    document.getElementById('shareBtn').style.display = 'none';
                    document.getElementById('expandAllBtn').style.display = 'none';
                    document.getElementById('collapseAllBtn').style.display = 'none';
                    document.getElementById('filterGroup').style.display = 'none';
                    document.getElementById('contentBody').innerHTML = `
                        <div class="empty-state">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                            </svg>
                            <p>从左侧选择一个日志文件查看内容</p>
                        </div>
                    `;
                }
            } catch (error) {
                showToast('删除失败：' + error.message);
            }
        }

        async function uploadFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            if (!file.name.endsWith('.log')) {
                showToast('只能上传 .log 文件');
                event.target.value = '';
                return;
            }
            
            const formData = new FormData();
            formData.append('file', file);
            
            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) {
                    const data = await response.json();
                    throw new Error(data.error || '上传失败');
                }
                
                showToast('上传成功');
            } catch (error) {
                showToast('上传失败：' + error.message);
            }
            
            event.target.value = '';
        }

        function renderFileList() {
            const fileList = document.getElementById('fileList');
            const fileCount = document.getElementById('fileCount');
            
            fileCount.textContent = `${files.length} 个文件`;

            if (files.length === 0) {
                fileList.innerHTML = `
                    <div class="empty-state" style="padding: 40px 20px;">
                        <p>暂无日志文件</p>
                    </div>
                `;
                return;
            }

            fileList.innerHTML = files.map(file => `
                <div class="file-item ${currentFile === file.name && currentSource === file.source ? 'active' : ''}" 
                     data-filename="${file.name}"
                     data-source="${file.source}"
                     onclick="selectFile('${file.name}', '${file.source}')">
                    <div class="file-date">
                        ${formatDateFromFilename(file.name)}
                        <span class="file-source ${file.source}">${file.source === 'upload' ? '上传' : (file.source === 'proxy' ? 'Proxy' : '系统')}</span>
                    </div>
                    <div class="file-meta">
                        <span class="file-name-text">${file.name}</span>
                        <span>${formatFileSize(file.size)}</span>
                        <span class="file-delete" onclick="deleteFile('${file.name}', '${file.source}', event)" title="删除文件">✕</span>
                    </div>
                </div>
            `).join('');
        }

        async function selectFile(filename, source) {
            currentFile = filename;
            currentSource = source;
            currentStartOffset = 0;
            currentFileLoadedFull = false;
            renderFileList();
            
            const contentBody = document.getElementById('contentBody');
            const contentTitle = document.getElementById('contentTitle');
            
            contentTitle.textContent = filename;
            contentBody.innerHTML = '<div class="loading"></div>';

            try {
                const response = await fetch(`/api/files/${encodeURIComponent(filename)}?source=${source}`);
                if (!response.ok) throw new Error('Failed to load file');
                
                const data = await response.json();
                currentStartOffset = Number.isFinite(data.startOffset) ? data.startOffset : 0;
                currentSkippedLines = Number.isFinite(data.skippedLines) ? data.skippedLines : 0;
                currentFileTruncated = !!data.truncated;
                currentFileSizeBytes = Number.isFinite(data.size) ? data.size : 0;
                logEntries = parseLogContent(data.content, currentSkippedLines);
                expandedEntries.clear();
                expandedDetailHeight = 0;
                virtualScrollState.expandedKey = '';
                document.getElementById('filterReqId').value = '';
                document.getElementById('filterContent').value = '';
                document.getElementById('filterType').checked = false;
                document.getElementById('filterMsg').checked = false;
                document.getElementById('filterRequestBody').checked = false;
                document.getElementById('filterOriginalResponse').checked = false;
                filteredEntries = logEntries;
                renderLogEntries(filteredEntries);
            } catch (error) {
                contentBody.innerHTML = `
                    <div class="empty-state">
                        <p>加载文件失败: ${error.message}</p>
                    </div>
                `;
            }
        }

        function updateConnectionStatus(connected) {
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            
            if (connected) {
                statusDot.classList.remove('disconnected');
                statusText.textContent = '已连接';
            } else {
                statusDot.classList.add('disconnected');
                statusText.textContent = '已断开';
            }
        }

        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}`);

            ws.onopen = () => {
                console.log('WebSocket connected');
                updateConnectionStatus(true);
            };

            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                
                switch (message.type) {
                    case 'files':
                        files = message.data;
                        renderFileList();
                        break;
                    
                    case 'fileChanged':
                        if (currentFile === message.data.filename && currentSource === message.data.source) {
                            if (refreshTimer) {
                                clearTimeout(refreshTimer);
                            }
                            refreshTimer = setTimeout(async () => {
                                try {
                                    const params = new URLSearchParams();
                                    params.set('source', currentSource);
                                    if (currentFileLoadedFull) {
                                        params.set('full', '1');
                                    }
                                    const response = await fetch(`/api/files/${encodeURIComponent(currentFile)}?${params.toString()}`);
                                    if (!response.ok) return;
                                    const data = await response.json();
                                    currentStartOffset = Number.isFinite(data.startOffset) ? data.startOffset : 0;
                                    currentSkippedLines = Number.isFinite(data.skippedLines) ? data.skippedLines : 0;
                                    currentFileTruncated = !!data.truncated;
                                    currentFileSizeBytes = Number.isFinite(data.size) ? data.size : currentFileSizeBytes;
                                    logEntries = parseLogContent(data.content, currentSkippedLines);
                                    applyFilters();
                                    const contentBody = document.getElementById('contentBody');
                                    contentBody.scrollTop = contentBody.scrollHeight;
                                    const contentTitle = document.getElementById('contentTitle');
                                    const existingBadge = contentTitle.querySelector('.update-badge');
                                    if (existingBadge) existingBadge.remove();
                                    const badge = document.createElement('span');
                                    badge.className = 'update-badge';
                                    badge.textContent = '已更新';
                                    contentTitle.appendChild(badge);
                                    setTimeout(() => badge.remove(), 2000);
                                } catch (e) {
                                }
                            }, 150);
                        }
                        break;
                    
                    case 'fileRemoved':
                        if (currentFile === message.data.filename) {
                            currentFile = null;
                            document.getElementById('contentTitle').textContent = '选择一个文件查看';
                            document.getElementById('logCount').textContent = '';
                            document.getElementById('backBtn').style.display = 'none';
                            document.getElementById('shareBtn').style.display = 'none';
                            document.getElementById('expandAllBtn').style.display = 'none';
                            document.getElementById('collapseAllBtn').style.display = 'none';
                            document.getElementById('filterGroup').style.display = 'none';
                            document.getElementById('contentBody').innerHTML = `
                                <div class="empty-state">
                                    <p>文件已被删除</p>
                                </div>
                            `;
                        }
                        break;
                }
            };

            ws.onclose = () => {
                console.log('WebSocket disconnected');
                updateConnectionStatus(false);
                setTimeout(connectWebSocket, 3000);
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                updateConnectionStatus(false);
            };
        }

        async function init() {
            try {
                const response = await fetch('/api/files');
                files = await response.json();
                renderFileList();
                
                const urlState = loadFromUrlParams();
                if (urlState) {
                    if (urlState.mode === 'chat') {
                        if (urlState.chat && urlState.chat.type === 'line') {
                            const fileExists = files.some(f => f.name === urlState.chat.file && f.source === urlState.chat.source);
                            if (!fileExists) {
                                setContentError('分享的文件不存在或不可用');
                            } else {
                                currentFile = urlState.chat.file;
                                currentSource = urlState.chat.source;
                                renderFileList();
                                openChatViewFromLine(urlState.chat.line, null, true);
                            }
                        }
                    } else {
                        const fileExists = files.some(f => f.name === urlState.file && f.source === urlState.source);
                        if (fileExists) {
                            await selectFile(urlState.file, urlState.source);
                            
                            document.getElementById('filterReqId').value = urlState.reqId;
                            document.getElementById('filterContent').value = urlState.content;
                            document.getElementById('filterType').checked = urlState.type;
                            document.getElementById('filterMsg').checked = urlState.msg;
                            document.getElementById('filterRequestBody').checked = urlState.requestBody;
                            document.getElementById('filterOriginalResponse').checked = urlState.originalResponse;
                            
                            applyFilters();
                        }
                    }
                }
            } catch (error) {
                console.error('Failed to load files:', error);
            }
            
            connectWebSocket();
        }

        init();
    </script>
</body>
</html>
